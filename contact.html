<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact - Salihat Mohammed</title>
</head>
<body>
  <header>
    <h1>Contact Salihat</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section id="greeting">
      <h2>Let's Connect</h2>
      <p>Hey Asalamu Aleykum, this is Salihat — feel free to reach out!</p>
    </section>

    <section id="contact-form">
      <h2>Contact Form</h2>
      <form>
        <label for="name">Your Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Your Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label>Gender:</label><br>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label><br>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br><br>

        <input type="checkbox" id="subscribe" name="subscribe">
        <label for="subscribe">Subscribe to newsletter</label><br><br>

        <label for="satisfaction">Satisfaction Level:</label><br>
        <input type="range" id="satisfaction" name="satisfaction" min="0" max="10"><br><br>

        <label for="message">Your Message:</label><br>
        <textarea id="message" name="message" rows="4" cols="30" required></textarea><br><br>

        <input type="submit" value="Send Message">
        <input type="reset" value="Clear">
      </form>
    </section>

    <section id="social">
      <h2>Find Me Online</h2>
      <ul>
        <li><a href="https://github.com/salihatali38-sys" target="_blank" title="GitHub Profile">GitHub</a></li>
        <li><a href="mailto:salihatali38@gmail.com" title="Send me an email">Email Me</a></li>
      </ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Salihat Mohammed. All rights reserved.</p>
  </footer>
</body>
</html>
