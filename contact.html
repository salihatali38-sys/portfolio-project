<!--
  contact.html - Personal Portfolio
  Contains a contact form using only HTML inputs (text, number, radio, checkbox, range)
  Labels are linked with for/id. Required fields are used where appropriate.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact - Alex Example</title>
  </head>
  <body>
    <header>
      <h1>Contact Alex</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <main>
      <section id="contact-form">
        <h2>Send a Message</h2>
        <!-- Comment: Simple contact form for feedback; all HTML only -->
        <form action="#" method="post">
          <div>
            <label for="name">Full name (required):</label>
            <input type="text" id="name" name="name" required />
          </div>

          <div>
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="0" max="120" />
          </div>

          <div>
            <span>Gender:</span>
            <label for="gender-male"><input type="radio" id="gender-male" name="gender" value="male" /> Male</label>
            <label for="gender-female"><input type="radio" id="gender-female" name="gender" value="female" /> Female</label>
            <label for="gender-other"><input type="radio" id="gender-other" name="gender" value="other" /> Other</label>
          </div>

          <div>
            <label for="subscribe"><input type="checkbox" id="subscribe" name="subscribe" /> Subscribe to updates</label>
          </div>

          <div>
            <label for="satisfaction">Satisfaction (1-10):</label>
            <input type="range" id="satisfaction" name="satisfaction" min="1" max="10" />
          </div>

          <div>
            <label for="message">Message:</label>
            <br />
            <textarea id="message" name="message" rows="5" cols="40"></textarea>
          </div>

          <div>
            <button type="submit">Submit</button>
            <button type="button" onclick="location.href='index.html'">Back to Home</button>
          </div>
        </form>
      </section>

      <section id="other-contacts">
        <h2>Other Ways to Reach Me</h2>
        <ul>
          <li><a href="https://github.com/" target="_blank" title="GitHub profile">GitHub</a></li>
          <li><a href="https://t.me/" target="_blank" title="Telegram">Telegram</a></li>
        </ul>
      </section>
    </main>

    <footer>
      <p>&copy; 2025 Alex Example</p>
    </footer>
  </body>
</html>
